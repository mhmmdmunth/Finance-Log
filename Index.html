<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Keuangan">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>Catatan Keuangan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<style>
:root{--a:#4f7cff;--b:#8b5cf6;--g:linear-gradient(135deg,#4f7cff,#8b5cf6);--t:#101828;--m:#667085;--l:#e6e9f5;--in:#0fa97a;--out:#e8416a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--t);background:radial-gradient(520px 300px at 100% -5%,#e3eaff,transparent),radial-gradient(480px 300px at -10% 15%,#f0e6ff,transparent),#fff;background-attachment:fixed;min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 4px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px;font-weight:800}
main{padding:8px 16px;max-width:560px;margin:auto}
.card{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--l);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(79,124,255,.07)}
.hero{background:var(--g);color:#fff;border:0;box-shadow:0 12px 30px rgba(110,100,250,.35)}
.hero small{opacity:.85}.big{font-size:30px;font-weight:800;margin:2px 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two div{background:rgba(255,255,255,.18);border-radius:14px;padding:10px}
.two b{display:block;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--l);background:#fff;border-radius:99px;padding:9px 15px;font:inherit;font-weight:600;color:var(--m);transition:.2s}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
.row{display:flex;gap:8px;margin-bottom:10px}
input,select{width:100%;font:inherit;border:1px solid var(--l);border-radius:14px;padding:13px;background:#fff;color:var(--t)}
input:focus,select:focus{outline:2px solid #b9c8ff}
.it{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--l);cursor:pointer}
.it:last-child{border:0}.it small,.mut{color:var(--m)}.in{color:var(--in)}.out{color:var(--out)}.it b{white-space:nowrap}
h3{margin:0 0 8px;font-size:15px}
.ins p{margin:6px 0}
.empty{text-align:center;color:var(--m);padding:28px 10px}.empty i{font-size:34px;font-style:normal;display:block;margin-bottom:6px}
.sk{height:90px;border-radius:20px;margin-bottom:12px;background:linear-gradient(90deg,#f1f3fb 25%,#e6e9f5 50%,#f1f3fb 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--l);padding:6px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--m);padding:8px;max-width:140px}
nav button b{display:block;font-size:20px;line-height:1.2}nav button.on{color:var(--a)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:99px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:16px 22px;box-shadow:0 10px 26px rgba(110,100,250,.45);transition:transform .15s}
.fab:active{transform:scale(.95)}
.ov{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:10;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#f1f3fb;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{border:0;border-radius:11px;padding:12px;font:inherit;font-weight:700;background:none;color:var(--m)}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}.seg .o.on{color:var(--out)}.seg .i.on{color:var(--in)}
.amt{font-size:28px;font-weight:800;text-align:center;margin-bottom:10px}
.btn{width:100%;border:0;border-radius:16px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:16px;margin-top:10px}
.btn:disabled{opacity:.6}.btn.d{background:#fff;color:var(--out);border:1px solid #f6c3cf}.btn.g{background:#f1f3fb;color:var(--t)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:#101828;color:#fff;padding:12px 18px;border-radius:14px;z-index:30;transition:.3s;max-width:90%}
.toast.on{transform:translate(-50%,0)}.toast.bad{background:var(--out)}
.lock{position:fixed;inset:0;background:#fff;z-index:20;display:none;align-items:center;justify-content:center;padding:24px}.lock.on{display:flex}
.logo{width:54px;height:54px;border-radius:18px;background:var(--g);margin:0 auto 10px}.err{color:var(--out);margin-top:12px;min-height:20px}
#gbtn{display:flex;justify-content:center;margin-top:14px;min-height:44px}
.bar{height:8px;border-radius:99px;background:#eef0fa;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;border-radius:99px;background:var(--g);transition:width .5s}.bar i.w{background:#f59e0b}.bar i.x{background:var(--out)}
canvas{max-height:240px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="lock" class="lock"><div class="card" style="width:100%;max-width:340px;text-align:center"><div class="logo"></div><h3 style="font-size:20px">Catatan Keuangan</h3><p class="mut">Masuk dengan akun Google yang sudah didaftarkan</p><div id="gbtn"></div><div class="err" id="pinErr"></div></div></div>
<header><h1 id="ttl">Beranda</h1><button class="chip" onclick="openMenu()">Akun</button></header><main id="v"></main>
<button class="fab" onclick="openForm()">+ Tambah Transaksi</button>
<nav><button data-v="home" class="on"><b>◉</b>Beranda</button><button data-v="stat"><b>◔</b>Grafik</button><button data-v="hist"><b>☰</b>Riwayat</button></nav>
<div class="ov" id="ov" onclick="if(event.target===this)closeS()"><div class="sheet" id="sh"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>(n<0?'-':'')+'Rp '+Math.round(Math.abs(n)).toLocaleString('id-ID'),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
dt=s=>new Date(s+'T00:00'),fd8=s=>dt(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}),
sum=(r,t)=>r.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
const DC={out:['Makan','Transport','Belanja','Tagihan','Hiburan','Kesehatan','Lainnya'],in:['Gaji','Freelance','Bonus','Lainnya']};
const TT={home:'Beranda',stat:'Grafik',hist:'Riwayat'};
let D=[],B=[],AL=[],P='month',C={a:'',b:''},V='home',SES='',U=null,F={q:'',t:'',k:'',d:''},CH={},E=null,ft='out',fk='';
try{SES=localStorage.getItem('ses')||'';U=JSON.parse(localStorage.getItem('usr')||'null')}catch(e){}
const isV=()=>U&&U.role==='viewer',isM=()=>U&&U.role==='master';

async function call(a,d){let r;
 try{const x=await fetch(API,{method:'POST',body:JSON.stringify({session:SES,action:a,data:d||{}})});r=await x.json()}
 catch(e){throw new Error('Koneksi gagal. Periksa internet lalu coba lagi.')}
 if(!r.ok){const e=new Error(r.error);e.auth=r.auth;throw e}return r.data}
function toast(m,good=true){const t=$('#toast');t.textContent=m;t.className='toast on'+(good?'':' bad');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='toast',2800)}
function cats(t){return [...new Set([...DC[t],...D.filter(r=>r.t===t).map(r=>r.k)])]}

async function load(quiet){
 if(!quiet)$('#v').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 try{const r=await call('init');D=r.rows;B=r.budget;U=r.me;try{localStorage.setItem('usr',JSON.stringify(U))}catch(e){}$('#lock').classList.remove('on');render()}
 catch(e){if(e.auth){showLock(e.message)}else{$('#v').innerHTML=`<div class="card empty"><i>⚠️</i>${esc(e.message)}<button class="btn" onclick="load()">Coba lagi</button></div>`}}
}
// ===== login Google =====
function showLock(m){SES='';try{localStorage.removeItem('ses')}catch(e){}$('#lock').classList.add('on');$('#pinErr').textContent=m||'';initG()}
function initG(){if(!window.google||!google.accounts)return setTimeout(initG,300);
 google.accounts.id.initialize({client_id:CLIENT_ID,callback:onG});
 google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',width:260})}
async function onG(r){$('#pinErr').textContent='Memeriksa akses…';
 try{const x=await call('login',{idtoken:r.credential});SES=x.session;U={email:x.email,role:x.role};
  try{localStorage.setItem('ses',SES);localStorage.setItem('usr',JSON.stringify(U))}catch(e){}$('#pinErr').textContent='';load()}
 catch(e){$('#pinErr').textContent=e.message}}
function logout(){try{localStorage.removeItem('ses');localStorage.removeItem('usr')}catch(e){}U=null;D=[];B=[];closeS();showLock('')}
function openMenu(){$('#sh').innerHTML=`<h3 style="font-size:18px">Akun</h3><p class="mut">${U?esc(U.email):''}<br>Peran: <b>${U?U.role:''}</b></p>${isM()?'<button class="btn" onclick="openAkses()">Kelola Akses</button>':''}<button class="btn d" onclick="logout()">Keluar</button><button class="btn g" onclick="closeS()">Tutup</button>`;$('#ov').classList.add('on')}
// ===== kelola akses (Master) =====
async function openAkses(){$('#sh').innerHTML='<div class="sk"></div>';try{AL=await call('ulist');drawAkses()}catch(e){toast(e.message,false);closeS()}}
function drawAkses(){$('#sh').innerHTML=`<h3 style="font-size:18px">Kelola Akses</h3><p class="mut">Master: ${esc(U.email)}<br><b>Editor</b>: boleh tambah, ubah, hapus. <b>Viewer</b>: hanya melihat.</p>`+
 (AL.length?AL.map((a,i)=>`<div class="row" style="align-items:center"><div style="flex:2;word-break:break-all">${esc(a.e)}</div><select style="flex:1" onchange="aSave(${i},this.value)"><option value="editor" ${a.r==='editor'?'selected':''}>Editor</option><option value="viewer" ${a.r==='viewer'?'selected':''}>Viewer</option></select><button class="chip" onclick="aDel(${i})">Cabut</button></div>`).join(''):`<div class="empty"><i>👥</i>Belum ada pengguna lain.</div>`)+
 `<h3 style="margin-top:14px">Tambah pengguna</h3><input id="ae" type="email" placeholder="email@gmail.com" autocapitalize="none"><div class="row" style="margin-top:8px"><select id="ar"><option value="viewer">Viewer (hanya lihat)</option><option value="editor">Editor (bisa edit)</option></select></div><button class="btn" onclick="aAdd()">Tambah</button><button class="btn g" onclick="closeS()">Tutup</button>`}
async function aDo(a,d,msg){try{await call(a,d);AL=await call('ulist');drawAkses();toast(msg)}catch(e){toast(e.message,false)}}
const aSave=(i,r)=>aDo('uset',{email:AL[i].e,role:r},'Peran diperbarui ✓'),aDel=i=>aDo('udel',{email:AL[i].e},'Akses dicabut ✓'),aAdd=()=>aDo('uset',{email:$('#ae').value,role:$('#ar').value},'Pengguna ditambahkan ✓');

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{V=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});

// ===== periode =====
function rng(){const n=new Date();let a,b;
 if(P==='day')a=b=ymd(n);
 else if(P==='week'){const d=new Date(n);d.setDate(n.getDate()-((n.getDay()+6)%7));a=ymd(d);d.setDate(d.getDate()+6);b=ymd(d)}
 else if(P==='month'){a=ymd(new Date(n.getFullYear(),n.getMonth(),1));b=ymd(new Date(n.getFullYear(),n.getMonth()+1,0))}
 else{a=C.a||ymd(n);b=C.b||a;if(b<a)b=a}
 return[a,b]}
function prev(R){const A=dt(R[0]);if(P==='month')return[ymd(new Date(A.getFullYear(),A.getMonth()-1,1)),ymd(new Date(A.getFullYear(),A.getMonth(),0))];
 const n=Math.round((dt(R[1])-A)/864e5)+1,pb=new Date(A);pb.setDate(pb.getDate()-1);const pa=new Date(pb);pa.setDate(pa.getDate()-n+1);return[ymd(pa),ymd(pb)]}
const inR=(r,R)=>r.d>=R[0]&&r.d<=R[1];
function setP(k){P=k;render()}
const chips=()=>`<div class="chips">${[['day','Hari ini'],['week','Minggu ini'],['month','Bulan ini'],['x','Custom']].map(([k,l])=>`<button class="chip ${P===k?'on':''}" onclick="setP('${k}')">${l}</button>`).join('')}</div>${P==='x'?`<div class="row"><input type="date" value="${C.a}" onchange="C.a=this.value;render()"><input type="date" value="${C.b}" onchange="C.b=this.value;render()"></div>`:''}`;
const item=r=>`<div class="it" onclick="openForm('${r.t}',${r.id})"><div><b>${esc(r.k)}</b><br><small>${fd8(r.d)}${r.n?' · '+esc(r.n):''}</small></div><b class="${r.t}">${r.t==='in'?'+':'-'}${rp(r.a)}</b></div>`;
const emptyBox=(i,t)=>`<div class="empty"><i>${i}</i>${t}</div>`;
const sorted=a=>[...a].sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id);

function render(){$('.fab').style.display=isV()?'none':'';$('#ttl').textContent=TT[V];Object.values(CH).forEach(c=>c.destroy());CH={};
 $('#v').innerHTML=V==='home'?home():V==='stat'?stat():hist();if(V==='stat')draw();window.scrollTo(0,0)}

function home(){const R=rng(),Pv=prev(R),cur=D.filter(r=>inR(r,R)),old=D.filter(r=>inR(r,Pv));
 const i=sum(cur,'in'),o=sum(cur,'out'),oo=sum(old,'out'),io=sum(old,'in'),today=ymd(new Date()),end=R[1]<today?R[1]:today;
 const days=Math.max(1,Math.round((dt(end)-dt(R[0]))/864e5)+1),by={};
 cur.filter(r=>r.t==='out').forEach(r=>by[r.k]=(by[r.k]||0)+r.a);
 const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
 const cmp=(n,p,lbl,up)=>p?`<p>${n>=p?'▲':'▼'} ${lbl} <b class="${(n>=p)===up?'in':'out'}">${Math.abs(Math.round((n-p)/p*100))}% ${n>=p?'naik':'turun'}</b> dibanding periode sebelumnya</p>`:`<p class="mut">${lbl}: belum ada data periode sebelumnya</p>`;
 return chips()+`<div class="card hero"><small>Saldo bersih</small><div class="big">${rp(i-o)}</div><div class="two"><div><small>Pemasukan</small><b>${rp(i)}</b></div><div><small>Pengeluaran</small><b>${rp(o)}</b></div></div></div>
 <div class="card ins"><h3>Insight</h3>${cur.length?`<p>Terbesar: <b>${top?esc(top[0]):'-'}</b>${top?' ('+rp(top[1])+')':''}</p><p>Rata-rata pengeluaran harian: <b>${rp(o/days)}</b></p>${cmp(o,oo,'Pengeluaran',false)}${cmp(i,io,'Pemasukan',true)}`:emptyBox('🌱','Belum ada transaksi di periode ini.')}</div>
 ${bcard()}
 <div class="card"><h3>Transaksi terbaru</h3>${D.length?sorted(D).slice(0,5).map(item).join(''):emptyBox('📝','Belum ada transaksi.'+(isV()?'':'<br>Ketuk “+ Tambah Transaksi” untuk mulai.'))}</div>`}

function stat(){const cur=D.filter(r=>inR(r,rng()));
 return chips()+(cur.length?`<div class="card"><h3>Pengeluaran per kategori</h3><canvas id="c1"></canvas></div><div class="card"><h3>Tren</h3><canvas id="c2"></canvas></div><div class="card"><h3>Pemasukan vs pengeluaran (6 bulan)</h3><canvas id="c3"></canvas></div>`:`<div class="card">${emptyBox('📊','Belum ada data untuk digrafikkan di periode ini.')}</div>`)}
function draw(){if(!window.Chart||!$('#c1'))return;const R=rng(),cur=D.filter(r=>inR(r,R)),pal=['#4f7cff','#8b5cf6','#22c7b8','#f59e0b','#e8416a','#64748b','#10b981','#06b6d4'],by={};
 cur.filter(r=>r.t==='out').forEach(r=>by[r.k]=(by[r.k]||0)+r.a);
 const tip={callbacks:{label:c=>' '+rp(c.parsed.y??c.parsed)}};
 CH.a=new Chart($('#c1'),{type:'doughnut',data:{labels:Object.keys(by),datasets:[{data:Object.values(by),backgroundColor:pal,borderWidth:2}]},options:{plugins:{tooltip:tip,legend:{position:'bottom'}}}});
 const mon=Math.round((dt(R[1])-dt(R[0]))/864e5)>45,key=r=>mon?r.d.slice(0,7):r.d,ks=[...new Set(cur.map(key))].sort(),g=t=>ks.map(k=>cur.filter(r=>r.t===t&&key(r)===k).reduce((s,r)=>s+r.a,0));
 CH.b=new Chart($('#c2'),{type:'line',data:{labels:ks.map(k=>k.length>7?k.slice(8)+'/'+k.slice(5,7):k),datasets:[{label:'Pemasukan',data:g('in'),borderColor:'#0fa97a',tension:.35},{label:'Pengeluaran',data:g('out'),borderColor:'#e8416a',tension:.35}]},options:{plugins:{tooltip:tip}}});
 const ms=[],n=new Date();for(let i=5;i>=0;i--)ms.push(ymd(new Date(n.getFullYear(),n.getMonth()-i,1)).slice(0,7));
 const m=t=>ms.map(k=>D.filter(r=>r.t===t&&r.d.slice(0,7)===k).reduce((s,r)=>s+r.a,0));
 CH.c=new Chart($('#c3'),{type:'bar',data:{labels:ms.map(k=>k.slice(5)+'/'+k.slice(2,4)),datasets:[{label:'Pemasukan',data:m('in'),backgroundColor:'#4f7cff',borderRadius:6},{label:'Pengeluaran',data:m('out'),backgroundColor:'#8b5cf6',borderRadius:6}]},options:{plugins:{tooltip:tip}}})}

function filt(){let a=D;if(F.t)a=a.filter(r=>r.t===F.t);if(F.k)a=a.filter(r=>r.k===F.k);if(F.d)a=a.filter(r=>r.d===F.d);
 if(F.q){const q=F.q.toLowerCase();a=a.filter(r=>(r.k+' '+r.n+' '+r.a).toLowerCase().includes(q))}return sorted(a)}
const lst=a=>a.length?a.slice(0,200).map(item).join(''):emptyBox('🔍','Tidak ada transaksi yang cocok.');
function list(){$('#lst').innerHTML=lst(filt())}
function hist(){const ks=[...new Set(D.map(r=>r.k))].sort();
 return `<input placeholder="Cari catatan, kategori, nominal…" value="${esc(F.q)}" oninput="F.q=this.value;list()" style="margin-bottom:10px">
 <div class="chips">${[['','Semua'],['in','Pemasukan'],['out','Pengeluaran']].map(([k,l])=>`<button class="chip ${F.t===k?'on':''}" onclick="F.t='${k}';render()">${l}</button>`).join('')}</div>
 <div class="row"><select onchange="F.k=this.value;list()"><option value="">Semua kategori</option>${ks.map(k=>`<option ${F.k===k?'selected':''}>${esc(k)}</option>`).join('')}</select><input type="date" value="${F.d}" onchange="F.d=this.value;list()"></div>
 <div class="card" id="lst">${lst(filt())}</div>`}

// ===== budget =====
const mk=()=>ymd(new Date()).slice(0,7);
const spent=k=>D.filter(r=>r.t==='out'&&r.d.startsWith(mk())&&(k==='Total'||r.k===k)).reduce((s,r)=>s+r.a,0);
function bcard(){const rows=[...B].sort((a,b)=>(b.k==='Total')-(a.k==='Total'));
 return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center;margin:0 0 8px"><h3 style="margin:0">Budget bulan ini</h3>${isM()?'<button class="chip" onclick="openBudget()">Atur</button>':''}</div>`+
 (rows.length?rows.map(b=>{const s=spent(b.k),p=s/b.a*100;
  return `<div><div class="row" style="justify-content:space-between;margin:0"><b>${b.k==='Total'?'Total pengeluaran':esc(b.k)}</b><small class="mut">${rp(s)} / ${rp(b.a)}</small></div><div class="bar"><i class="${p>100?'x':p>=80?'w':''}" style="width:${Math.min(p,100)}%"></i></div><small class="${p>100?'out':'mut'}" style="display:block;margin:-6px 0 10px">${p>100?'Lebih '+rp(s-b.a):'Sisa '+rp(b.a-s)} · ${Math.round(p)}%</small></div>`}).join(''):emptyBox('🎯','Belum ada budget.'+(isM()?'<br>Ketuk “Atur” untuk membuat batas bulanan.':'')))+'</div>'}
function over(k){for(const n of [k,'Total']){const b=B.find(x=>x.k===n);if(!b)continue;const p=spent(n)/b.a*100,l=n==='Total'?'total':n;
 if(p>100)return 'Budget '+l+' terlampaui ('+Math.round(p)+'%)';if(p>=80)return 'Budget '+l+' sudah '+Math.round(p)+'%'}return ''}
function openBudget(){const ks=['Total',...cats('out')],f=k=>{const b=B.find(x=>x.k===k);return b?rp(b.a):''};
 $('#sh').innerHTML=`<h3 style="font-size:18px">Budget bulanan</h3><p class="mut">Batas pengeluaran per bulan. Kosongkan jika tanpa batas.</p>${ks.map(k=>`<div class="row" style="align-items:center"><b style="flex:1">${k==='Total'?'Total semua':esc(k)}</b><input class="bi" data-k="${esc(k)}" inputmode="numeric" placeholder="Rp 0" oninput="fmt(this)" style="flex:1" value="${f(k)}"></div>`).join('')}<button class="btn" id="bs" onclick="saveBudget()">Simpan budget</button><button class="btn g" onclick="closeS()">Batal</button>`;$('#ov').classList.add('on')}
async function saveBudget(){const b=$('#bs');b.disabled=true;b.textContent='Menyimpan…';
 try{for(const el of document.querySelectorAll('.bi')){const k=el.dataset.k,a=parseInt(el.value.replace(/\D/g,''))||0,old=(B.find(x=>x.k===k)||{}).a||0;
  if(a===old)continue;if(a>0)await call('bset',{k,a});else await call('bdel',{k})}
  closeS();toast('Budget tersimpan ✓');await load(true)}
 catch(e){toast('Gagal menyimpan budget: '+e.message,false);b.disabled=false;b.textContent='Simpan budget'}}

// ===== form =====
function openForm(t,id){if(isV())return toast('Peran Viewer hanya bisa melihat data',false);
 E=id?D.find(r=>r.t===t&&r.id===id):null;ft=E?E.t:'out';fk=E?E.k:'';const fa=E?String(E.a):'';
 $('#sh').innerHTML=`<div class="seg"><button class="o" onclick="setT('out')">Pengeluaran</button><button class="i" onclick="setT('in')">Pemasukan</button></div>
 <input id="fa" class="amt" inputmode="numeric" placeholder="Rp 0" value="${fa?rp(+fa):''}" oninput="fmt(this)">
 <div class="cats" id="cats"></div><input id="fd" type="date" value="${E?E.d:ymd(new Date())}" style="margin-bottom:10px"><input id="fn" placeholder="Catatan (opsional)" value="${E?esc(E.n):''}">
 <button class="btn" id="fs" onclick="save()">Simpan</button>${E?'<button class="btn d" onclick="askDel()">Hapus transaksi</button>':''}<button class="btn g" onclick="closeS()">Batal</button>`;
 setT(ft,true);$('#ov').classList.add('on');if(!E)setTimeout(()=>$('#fa').focus(),250)}
function setT(t,keep){ft=t;if(!keep)fk='';document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.className.startsWith(t==='in'?'i':'o')));
 $('#cats').innerHTML=cats(t).map(k=>`<button class="chip ${k===fk?'on':''}" onclick="fk=this.textContent;setT(ft,true)">${esc(k)}</button>`).join('')}
function fmt(el){const n=el.value.replace(/\D/g,'');el.value=n?rp(+n):''}
function closeS(){$('#ov').classList.remove('on')}
async function save(){const a=parseInt($('#fa').value.replace(/\D/g,''))||0,d=$('#fd').value;
 if(a<=0)return toast('Nominal harus lebih dari 0',false);if(!fk)return toast('Pilih kategori dulu',false);if(!d)return toast('Tanggal wajib diisi',false);
 const b=$('#fs');b.disabled=true;b.textContent='Menyimpan…';
 try{const x={t:ft,d,k:fk,a,n:$('#fn').value.trim()};
  if(E)await call('upd',{...x,id:E.id,ot:E.t,sig:E.d+'|'+E.a});else await call('add',x);
  closeS();await load(true);const w=x.t==='out'?over(x.k):'';toast(w||'Transaksi tersimpan ✓',!w)}
 catch(e){toast('Gagal menyimpan: '+e.message,false);b.disabled=false;b.textContent='Simpan'}}
function askDel(){$('#sh').innerHTML=`<h3 style="font-size:18px">Hapus transaksi ini?</h3><p class="mut">${esc(E.k)} · ${rp(E.a)} · ${fd8(E.d)}<br>Baris ini akan dihapus dari spreadsheet dan tidak bisa dikembalikan dari aplikasi.</p><button class="btn d" id="fx" onclick="doDel()">Ya, hapus</button><button class="btn g" onclick="closeS()">Batal</button>`}
async function doDel(){const b=$('#fx');b.disabled=true;b.textContent='Menghapus…';
 try{await call('del',{t:E.t,id:E.id,sig:E.d+'|'+E.a});closeS();toast('Transaksi dihapus ✓');await load(true)}
 catch(e){toast('Gagal menghapus: '+e.message,false);b.disabled=false;b.textContent='Ya, hapus'}}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(SES)load();else showLock('');
</script></body></html>
